{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Verifying{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --muted:#666; --bg:#fafaf9; --card:#fff; --line:#e5e5e3; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#ededed; --muted:#9a9a9a; --bg:#131313; --card:#1c1c1c; --line:#2e2e2e; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { width:100%; max-width:26rem; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:28px; }
  h1 { font-size:1.05rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.25rem; }
  .track { height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .2s ease; }
  button { font:inherit; font-weight:500; width:100%; padding:.7rem 1rem; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .note { font-size:.8rem; color:var(--muted); margin:1rem 0 0; }
  .list { list-style:none; padding:0; margin:0 0 1.25rem; }
  .list li { display:flex; flex-direction:column; gap:.15rem; padding:.6rem 0;
             border-bottom:1px solid var(--line); font-size:.9rem; }
  .list span { color:var(--muted); font-size:.8rem; }
  noscript { display:block; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">{% block body %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
